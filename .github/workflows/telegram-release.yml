name: Send Release APK to Telegram

run-name: Send ${{ inputs.release_tag }} arm64 APK to Telegram

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag or title, for example V1.0.307 or V1.0.307preview
        required: true
        type: string
      topic_id:
        description: Optional Telegram forum topic id; falls back to the TELEGRAM_TOPIC_ID secret, then the General topic
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  send:
    name: Send existing arm64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Download arm64 APK from GitHub Release
        id: release_apk
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          tag="$(printf '%s' "$RELEASE_TAG" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$tag" ]; then
            echo "::error title=Release tag missing::Please enter a GitHub Release tag or title, for example V1.0.307."
            exit 1
          fi

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Release titles and tags differ in this repo (title V1.0.307preview
            # sits on tag V1.0.307), so retry the lookup by exact release title.
            title_json="$(printf '%s' "$tag" | jq -Rr '@json')"
            title_tag="$(
              gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                --json name,tagName \
                --jq ".[] | select(.name == ${title_json}) | .tagName" \
              | head -n 1
            )" || true
            if [ -z "${title_tag:-}" ]; then
              echo "::error title=Release not found::GitHub Release $tag does not exist."
              exit 1
            fi
            echo "Input matched a release title; using tag '$title_tag'."
            tag="$title_tag"
          fi

          # Release assets are named like Monica-Steam-Android-arm64-v8a-1.0.307-26081618-01.APK,
          # so the .apk extension has to match case-insensitively and armeabi-v7a must stay excluded.
          shopt -s nocasematch
          arm64_assets=()
          while IFS= read -r asset_name; do
            if [[ "$asset_name" =~ arm64.*\.apk$ ]]; then
              arm64_assets+=("$asset_name")
            fi
          done < <(
            gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )
          shopt -u nocasematch

          if [ "${#arm64_assets[@]}" -eq 0 ]; then
            echo "::error title=arm64 APK missing::Release $tag has no arm64 APK asset. Build and upload the arm64 APK to this Release first."
            echo "Available assets:"
            gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' || true
            exit 1
          fi

          if [ "${#arm64_assets[@]}" -gt 1 ]; then
            echo "Multiple arm64 APK assets found; the first one will be sent:"
            printf '  %s\n' "${arm64_assets[@]}"
          fi

          asset_name="${arm64_assets[0]}"
          rm -rf release-assets
          mkdir -p release-assets
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset_name" \
            --dir release-assets

          apk_path="release-assets/$asset_name"
          if [ ! -f "$apk_path" ]; then
            echo "::error title=APK download failed::Downloaded asset was not found at $apk_path."
            exit 1
          fi

          # Tags may contain non-ASCII characters (for example V1.0.304补丁),
          # so percent-encode the tag for the release URL in the caption.
          encoded_tag="$(printf '%s' "$tag" | jq -Rr '@uri')"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "url_tag=$encoded_tag" >> "$GITHUB_OUTPUT"
          echo "Selected asset: $asset_name"

      - name: Build caption with release notes
        id: build_caption
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_apk.outputs.tag }}
          URL_TAG: ${{ steps.release_apk.outputs.url_tag }}
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json body --jq '.body' > release-notes.md

          # Convert the markdown release notes to Telegram HTML and wrap them in an
          # expandable blockquote (collapsed by default, tap the arrow to expand).
          # Captions are capped at 1024 UTF-16 units, so trim line by line if needed.
          python3 - "$RELEASE_TAG" "$URL_TAG" <<'PY'
          import html, os, re, sys

          tag, url_tag = sys.argv[1], sys.argv[2]
          repo = os.environ['GITHUB_REPOSITORY']
          body = open('release-notes.md', encoding='utf-8').read().strip()

          def convert(text):
              t = html.escape(text, quote=False)
              t = re.sub(r'```[^\n]*\n(.*?)```', lambda m: '<pre>' + m.group(1) + '</pre>', t, flags=re.S)
              t = re.sub(r'`([^`\n]+)`', r'<code>\1</code>', t)
              t = re.sub(r'\[([^\]\n]+)\]\((https?://[^)\s]+)\)', r'<a href="\2">\1</a>', t)
              t = re.sub(r'^#{1,6}\s*(.+)$', r'<b>\1</b>', t, flags=re.M)
              t = re.sub(r'\*\*([^*\n]+)\*\*', r'<b>\1</b>', t)
              t = re.sub(r'^\s*[-*]\s+', '• ', t, flags=re.M)
              return t

          header = (
              f'🚀 Monica Steam 新版本 {tag} 已发布！\n'
              '架构：arm64\n'
              f'仓库：{repo}\n'
              f'下载页面：https://github.com/{repo}/releases/tag/{url_tag}'
          )

          def build(lines, truncated):
              notes = convert('\n'.join(lines))
              if truncated:
                  notes += '\n\n…（日志过长已截断，完整内容见下载页面）'
              return header + '\n\n📦 <b>更新日志</b>\n<blockquote expandable>' + notes + '</blockquote>'

          def fits(caption):
              visible = re.sub(r'<[^>]+>', '', caption)
              return len(visible.encode('utf-16-le')) // 2 <= 1024

          if not body:
              caption = header
          else:
              src = body.splitlines()
              caption = build(src, False)
              if not fits(caption):
                  lines = src[:]
                  while lines and not fits(build(lines, True)):
                      lines.pop()
                  caption = build(lines, True) if lines else header

          with open('caption.html', 'w', encoding='utf-8') as f:
              f.write(caption)
          visible = re.sub(r'<[^>]+>', '', caption)
          print(f'Caption length: {len(visible.encode("utf-16-le")) // 2}/1024')
          PY

      - name: Send APK to Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ inputs.topic_id || secrets.TELEGRAM_TOPIC_ID }}
          APK_PATH: ${{ steps.release_apk.outputs.path }}
        run: |
          set -euo pipefail

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error title=Telegram secrets missing::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is empty."
            exit 1
          fi

          caption="$(cat caption.html)"

          # Forum topics require message_thread_id; when unset Telegram posts to the General topic.
          thread_args=()
          if [ -n "${TOPIC_ID:-}" ]; then
            if ! [[ "$TOPIC_ID" =~ ^-?[0-9]+$ ]]; then
              echo "::error title=Invalid topic id::Topic id must be a number, for example 12."
              exit 1
            fi
            thread_args=(--form-string "message_thread_id=${TOPIC_ID}")
            echo "Sending to topic ${TOPIC_ID}."
          fi

          curl --fail-with-body --show-error --silent \
            --retry 3 \
            --retry-all-errors \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "caption=${caption}" \
            --form-string "parse_mode=HTML" \
            "${thread_args[@]}" \
            --form "document=@${APK_PATH}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
